name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pandas numpy scikit-learn pytest flake8

      - name: Lint (PEP 8)
        run: flake8 --max-line-length=100 task-1-iris-wine-classification task-2-california-housing-regression

      - name: Run tests
        run: pytest -q
